name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, codex/authenticated-discovery]
    paths:
      - 'tool/android-build-request.txt'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform scaffold
        run: |
          flutter --version
          flutter create --platforms=android --project-name odin_security --org com.odin --no-pub .
          dart run tool/prepare_android.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OdinSecurity-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
